[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nowcastbox"
dynamic = ["version"]
description = "Nowcasting with dynamic factor models in Python: two-step (Giannone-Reichlin-Small) and EM mixed-frequency (Banbura-Modugno) DFMs, Bai-Ng selection, pseudo real-time vintages, news decomposition, real-time evaluation and Brazilian data connectors"
authors = [
    {name = "Gustavo Haase", email = "gustavo.haase@gmail.com"},
    {name = "Alexandre Leão Sanches", email = "a.leaosanches@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE", "nowcastbox/datasets/licenses/*.txt"]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "nowcasting",
    "dynamic factor model",
    "DFM",
    "mixed frequency",
    "Kalman filter",
    "EM algorithm",
    "state space",
    "macroeconomics",
    "GDP",
    "news decomposition",
    "real-time data",
    "vintages",
    "econometrics",
    "forecasting",
    "Brazil",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "numba>=0.57.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "requests>=2.28.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "threadpoolctl>=3.1.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=12.0.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "threadpoolctl>=3.1.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=12.0.0",
    "openpyxl>=3.1",
    "ruff>=0.15.0",
    # pinned with the stubs: newer pandas-stubs/pyright releases change the type verdicts
    "pyright==1.1.408",
    "pandas-stubs==3.0.0.260204; python_version >= '3.11'",
    "interrogate>=1.7.0",
    "bandit>=1.7.0",
    "radon>=6.0.0",
    "pre-commit>=3.5.0",
    "nbmake>=1.5.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.25.0",
    "mkdocstrings-python>=1.10.0",
    "mkdocs-jupyter>=0.24.0",
]
# Parquet I/O of VintageStore (data_sources use plain ``requests`` + an own disk cache;
# FRED is queried through its REST API, so no fredapi/requests-cache are needed).
data = [
    "pyarrow>=12.0.0",
]
r = [
    "rpy2>=3.5.0",
]
# Excel data templates and result export (pipeline ``data.source: excel``, ``outputs.excel``).
excel = [
    "openpyxl>=3.1",
]

[project.scripts]
nowcastbox = "nowcastbox.cli:main"

[project.urls]
Homepage = "https://github.com/NowcastBox/nowcastbox"
Documentation = "https://nowcastbox.readthedocs.io/"
Repository = "https://github.com/NowcastBox/nowcastbox"
Issues = "https://github.com/NowcastBox/nowcastbox/issues"
Changelog = "https://github.com/NowcastBox/nowcastbox/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "nowcastbox.__version__.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["nowcastbox*"]
exclude = ["desenvolvimento*", "tests*", "examples*", "paper*", "benchmarks*", "scripts*"]

[tool.setuptools.package-data]
nowcastbox = [
    "py.typed",
    "datasets/data/*.csv",
    "datasets/data/*.csv.gz",
    "datasets/data/*.parquet",
    "datasets/metadata/*.yaml",
    "datasets/licenses/*.txt",
    "reports/templates/**/*.html",
    "reports/templates/**/*.css",
    "reports/templates/**/*.js",
    "pipeline/templates/*.yaml",
    "pipeline/templates/*.xlsx",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--timeout=600",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: tests that need internet access (BCB/IBGE/IPEA/FRED APIs)",
    "reference_divergence: documented intentional divergence from a reference implementation",
    "reference_validation: tests that compare against fixtures generated by R/Octave/statsmodels",
    "benchmark: performance benchmark tests",
    "integration: integration tests",
    "property: property-based tests (hypothesis)",
]
filterwarnings = [
    "ignore::DeprecationWarning:numba.*",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["nowcastbox"]
branch = true
omit = [
    "nowcastbox/cli/__main__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
precision = 2
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
    "def __repr__",
]

[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".venv",
    "venv",
    "desenvolvimento",
    "paper",
    "htmlcov",
    "mutants",
    "site",
    "*.ipynb",
    "*.md",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle (NumPy convention)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "NPY",  # numpy-specific rules
    "PD",   # pandas-vet
    "PT",   # flake8-pytest-style
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "TC",   # type-checking imports
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
]
ignore = [
    "E501",   # line too long (formatter handles it)
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__ (documented in the class docstring)
    "D401",   # non-imperative mood (false positives in scientific docstrings)
    "RUF001", # ambiguous unicode characters (Portuguese text / math symbols)
    "RUF002",
    "RUF003",
    "PD011",  # .values usage is common in numerical code
    "N803",   # argument names such as X, A, Q, R follow the math notation
    "N806",   # variable names such as Lambda, Psi, Z, T follow the math notation
    "E741",   # ambiguous variable names (l, I) used in math
    "SIM108", # ternary preference
    "PT011",  # pytest.raises too broad
    "TC001",  # typing-only first-party import (readability over micro-optimisation)
    "TC002",
    "TC003",
    "ANN401", # Any is sometimes the honest type (params dicts)
    "S301",   # pickle is the documented save/load format of results objects
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402"]
"tests/**/*.py" = ["S101", "S301", "S311", "S108", "ANN", "D", "PD", "N802", "PT018", "SLF001"]
"examples/**/*.py" = ["E402", "S101", "D", "ANN", "T201"]
"benchmarks/**/*.py" = ["E402", "S101", "D", "ANN"]
"scripts/**/*.py" = ["S101", "S603", "S607", "T201"]
"docs/**/*.py" = ["E402", "S101", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["nowcastbox"]

# ---------------------------------------------------------------------------
# pyright. Plan §10.1 asks for "strict" in core/ and statespace/; with pandas-stubs
# the reportUnknown* family is pure noise, so we run "standard" everywhere plus the
# strict-only checks that matter, and keep reportUnknown* off.
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["nowcastbox"]
reportMissingParameterType = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportUntypedFunctionDecorator = "error"
reportPrivateUsage = "warning"
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    "desenvolvimento",
    "examples",
    "paper",
]
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

# ---------------------------------------------------------------------------
# interrogate (docstring coverage)
# ---------------------------------------------------------------------------
[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
fail-under = 95
exclude = ["tests", "desenvolvimento", "examples", "paper", "docs", "scripts", "benchmarks"]
verbose = 1
color = true
omit-covered-files = true

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "examples", "desenvolvimento", "paper", "scripts"]
skips = ["B301", "B403"]

# ---------------------------------------------------------------------------
# mutmut (numerical core, plan §10.1)
# ---------------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = ["nowcastbox/statespace/", "nowcastbox/models/"]
tests_dir = ["tests/statespace/", "tests/models/"]
pytest_add_cli_args = ["-x", "--timeout=120", "-q", "--no-header"]
