title: FRED-MD monthly US macro database + FRED-QD real GDP
description: 'FRED-MD (McCracken & Ng, 2016): ~120 monthly US macroeconomic series from 1959 with the
  official transformation codes, mapped to named nowcastbox transforms (tcode 1 level, 2 diff, 3 diff|diff,
  4 log, 5 dlog, 6 log|diff|diff, 7 pct_change|diff), plus quarterly real GDP (GDPC1) from FRED-QD stored
  in the third month of each quarter. Values in levels as in the vintage file.'
loader: load_us_fred_md
target: GDPC1
url: https://www.stlouisfed.org/research/economists/mccracken/fred-databases
license: FRED-MD/FRED-QD are distributed freely by the Federal Reserve Bank of St. Louis for research.
  The shipped series come from US government agencies (BEA, BLS, Census, Federal Reserve Board, Treasury;
  public domain) or are constructed by McCracken & Ng; series under third-party copyright are excluded
  (see 'excluded_for_license').
citation: 'McCracken, M. W. & Ng, S. (2016). FRED-MD: A Monthly Database for Macroeconomic Research. Journal
  of Business & Economic Statistics, 34(4), 574-589. McCracken, M. W. & Ng, S. (2020). FRED-QD: A Quarterly
  Database for Macroeconomic Research. NBER Working Paper 26872.'
sources:
- 'FRED-MD vintage 2026-08 (revised): https://www.stlouisfed.org/-/media/project/frbstl/stlouisfed/research/fred-md/monthly/2026-rev-08-md.csv'
- 'FRED-QD vintage 2026-08 (revised): https://www.stlouisfed.org/-/media/project/frbstl/stlouisfed/research/fred-md/quarterly/2026-rev-08-qd.csv'
excluded_for_license:
- series: S&P 500
  reason: S&P Dow Jones Indices copyright
- series: S&P div yield
  reason: S&P Dow Jones Indices copyright
- series: S&P PE ratio
  reason: S&P Dow Jones Indices copyright
- series: AAA
  reason: Moody's copyright
- series: BAA
  reason: Moody's copyright
- series: AAAFFM
  reason: Moody's copyright (spread built on AAA)
- series: BAAFFM
  reason: Moody's copyright (spread built on BAA)
- series: UMCSENTx
  reason: University of Michigan Surveys of Consumers copyright
- series: VIXCLSx
  reason: Cboe copyright
notes: 'Blocks: ''global'' plus the FRED-MD group of the series. Delays are stylised typical US publication
  lags by group/series (days after the end of the month). The ''fred_md_tcode'' legend column keeps the
  original code.'
vintage: 2026-08 (revised)
