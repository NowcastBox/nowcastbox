title: Brazilian nowcasting panel (BCB, IBGE, IPEA)
description: 'Monthly and quarterly Brazilian indicators from 2003 to the latest release for nowcasting
  quarterly GDP: national accounts (target: seasonally adjusted GDP volume index, QoQ growth), IBC-Br,
  industrial production, retail and services surveys, labour market, external trade, prices, money, credit,
  fiscal, financial variables and Focus survey expectations. Values are in levels as published; the legend
  gives the named stationarity transformation.'
loader: load_brazil_nowcast
target: pib
url: https://www.bcb.gov.br/estatisticas ; https://sidra.ibge.gov.br ; http://www.ipeadata.gov.br
sources:
- Banco Central do Brasil - SGS (dadosabertos.bcb.gov.br), ODbL
- Banco Central do Brasil - Focus market expectations (Olinda API), ODbL
- IBGE - SIDRA (sidra.ibge.gov.br), free use with attribution
- IPEADATA (ipeadata.gov.br), free use citing IPEA and the original source (EPE/Eletrobras, ANP, SECEX/MDIC,
  Receita Federal, Ministry of Labour)
license: 'Data: BCB series under the Open Data Commons Open Database License (ODbL 1.0) as published on
  dadosabertos.bcb.gov.br; IBGE and IPEADATA public data, free reuse with attribution of the source. Only
  open-license sources are included.'
citation: 'Banco Central do Brasil (SGS, Focus); IBGE (SIDRA: Contas Nacionais Trimestrais, PIM-PF, PMC,
  PMS, IPCA, INPC, IPP, PNAD Continua); IPEA (IPEADATA). Compiled by nowcastbox (scripts/build_datasets/build_brazil_nowcast.py).'
notes: Delays are stylised typical publication lags (days after the end of the reference month/quarter)
  from the 2024-2026 release calendars; GDP release dates are available exactly in load_brazil_calendar().
  Seasonally adjusted series are used where the source publishes them; for unadjusted series the legend
  proposes 12-month transformations (dlog_yoy, annual_diff). The seasonal adjustment and the whole history
  of each series correspond to the latest vintage (no real-time data, see load_brazil_vintages for GDP).
  Focus constant-horizon expectations weight the current and next calendar year forecasts by (13-m)/12
  and (m-1)/12 (Dovern, Fritsche & Slacalek, 2012).
excluded_for_license:
- series: FGV confidence indices, IGP-M/IGP-DI/IPA
  reason: FGV terms restrict redistribution
- series: CNI ICEI, industrial survey indicators
  reason: third-party (CNI) terms unclear
- series: ANFAVEA vehicle production/sales (SGS 1373, 1378)
  reason: third-party (ANFAVEA) terms unclear
- series: FENABRAVE dealer sales (SGS 7384-7389)
  reason: third-party (FENABRAVE) terms unclear
- series: Fecomercio consumer confidence (SGS 4393-4395)
  reason: third-party (Fecomercio-SP) terms unclear
- series: ABPO corrugated cardboard, Aco Brasil steel (SGS 7357)
  reason: third-party associations, terms unclear
dropped: []
