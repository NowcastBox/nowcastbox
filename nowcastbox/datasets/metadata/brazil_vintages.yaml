name: brazil_vintages
title: Real-time vintages of Brazilian quarterly GDP (IBGE)
description: Seasonally adjusted chained volume indices (1995=100) of GDP, value added by sector and demand
  components as published in each IBGE quarterly national accounts release since 2010Q1 (one vintage per
  release), for real-time evaluation and revision analysis.
loader: load_brazil_vintages
target: pib
url: https://ftp.ibge.gov.br/Contas_Nacionais/Contas_Nacionais_Trimestrais/Fasciculo_Indicadores_IBGE/
sources:
- IBGE - Contas Nacionais Trimestrais, Indicadores de Volume e Valores Correntes (one publication per
  quarter), Tabela 6
license: IBGE public data; free reuse with attribution of the source (IBGE).
citation: 'IBGE - Instituto Brasileiro de Geografia e Estatística. Contas Nacionais Trimestrais: Indicadores
  de Volume e Valores Correntes, releases 2010Q1 to 2026Q2. Compiled by nowcastbox.'
notes: 'Values are the seasonally adjusted index levels; growth rates are computed by the user (e.g. QoQ
  = pct_change). Because IBGE re-estimates the seasonal adjustment each quarter, the whole history changes
  from release to release. Release dates: see the ''releases'' file and its ''date_source'' column. Releases
  2006Q4-2009Q4 (Word documents with embedded tables) are not included.'
