    sha256: b03f91bd761ddc2aa9fa45e22e6c6bbd5f4bef60604e1255ead684ca429d38bb
    format: csv.gz (wide; period column YYYY-MM; quarterly values in 3rd month)
    n_rows: 385
    n_columns: 29
