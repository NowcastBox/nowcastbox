title: NY Fed Staff Nowcast replication panel (US)
description: 'The public example panel of the FRBNY Staff Nowcast (Bok, Caratelli, Giannone, Sbordone
  & Tambalotti, 2018): monthly and quarterly US series (1985 onwards) with the NY Fed block structure
  (global, soft, real, labor), transformations and categories, data vintage 2017-01-27. Target: real GDP
  (GDPC1).'
loader: load_nyfed
target: GDPC1
url: https://github.com/FRBNY-TimeSeriesAnalysis/Nowcasting
sources:
- https://github.com/FRBNY-TimeSeriesAnalysis/Nowcasting - Spec_US_example.xls and data/US/2017-01-27.xls
  (data downloaded by the NY Fed from FRED, Federal Reserve Bank of St. Louis)
license: 'Repository files: BSD 3-Clause License, Copyright (c) 2018, Federal Reserve Bank of New York
  (redistribution with this notice). Underlying series: FRED, from US government agencies and regional
  Federal Reserve Banks.'
citation: Bok, B., Caratelli, D., Giannone, D., Sbordone, A. M. & Tambalotti, A. (2018). Macroeconomic
  Nowcasting and Forecasting with Big Data. Annual Review of Economics, 10, 615-643 (Federal Reserve Bank
  of New York Staff Report 830).
notes: 'The NY Fed note that these example files do not exactly reproduce the published Staff Nowcast
  (data redistribution restrictions). ''nyfed_model'' = 1 marks the 25 series of the example model (Model
  column of the specification); load_nyfed(model_only=True) keeps only those. Transformations: lin ->
  level, chg -> diff, pch -> pct_change(1)|scale(100), pca (compounded annual rate) -> log|diff(1)|scale(400),
  its first-order approximation; the original code is in ''nyfed_transformation''. Delays are stylised
  typical US publication lags (not part of the NY Fed files).'
vintage: '2017-01-27'
license_notice: Copyright (c) 2018, Federal Reserve Bank of New York. All rights reserved. Redistribution
  and use in source and binary forms, with or without modification, are permitted provided that the conditions
  of the BSD 3-Clause License are met (see nowcastbox/datasets/licenses/NYFED-BSD-3-Clause.txt).
